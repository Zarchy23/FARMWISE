{% extends 'base.html' %}
{% block title %}Plant Crop{% endblock %}
{% block page_title %}Plant New Crop{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6">Plant New Crop</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Select Field</label>
                <select name="field" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">-- Select Field --</option>
                    {% for field in form.fields.field.queryset %}
                    <option value="{{ field.id }}">{{ field.farm.name }} - {{ field.name }} ({{ field.area_hectares }} ha)</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Crop Type</label>
                <select name="crop_type" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">-- Select Crop --</option>
                    {% for crop in form.fields.crop_type.queryset %}
                    <option value="{{ crop.id }}">{{ crop.name }} ({{ crop.growing_days }} days to harvest)</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Variety</label>
                <input type="text" name="variety" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="e.g., Hybrid, Local, Organic">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Season</label>
                <select name="season" id="season_select" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">-- Select Season --</option>
                    <option value="main_rainy">Main Rainy Season (Nov-Mar)</option>
                    <option value="early_planting">Early Planting (Sept-Oct)</option>
                    <option value="late_planting">Late Planting (Dec-Jan)</option>
                    <option value="winter">Winter Season (Apr-Aug)</option>
                    <option value="irrigated">Irrigated/Off-Season</option>
                    <option value="short_rain">Short Rain Season</option>
                </select>
                <div id="season_warning" class="text-red-500 text-sm mt-1 hidden"></div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">Planting Date</label>
                    <input type="date" name="planting_date" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">Expected Harvest Date</label>
                    <input type="date" name="expected_harvest_date" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Area Allocated (hectares) *</label>
                <input type="number" step="0.01" min="0" name="area_allocated_hectares" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Enter area in hectares">
                <div id="area_info" class="text-gray-500 text-sm mt-1"></div>
                <div id="area_warning" class="text-red-500 text-sm mt-1 hidden"></div>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Estimated Yield (kg)</label>
                <input type="number" step="0.01" name="estimated_yield_kg" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Optional">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Crop Photo <span class="text-gray-500">(Optional)</span></label>
                <input type="file" name="photo" accept="image/*" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                <p class="text-gray-500 text-sm mt-1">JPG, PNG, or GIF (Max 5MB)</p>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Notes</label>
                <textarea name="notes" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Any additional information..."></textarea>
            </div>
            
            <div class="flex space-x-3 mt-6">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">Plant Crop</button>
                <a href="{% url 'core:crop_list' %}" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Crop suitability data (would ideally come from server)
    const cropSuitability = {
        // This will be populated dynamically from crop type data
    };
    
    const cropTypeSelect = document.querySelector('select[name="crop_type"]');
    const fieldSelect = document.querySelector('select[name="field"]');
    const seasonSelect = document.querySelector('select[name="season"]');
    const plantingDateInput = document.querySelector('input[name="planting_date"]');
    const harvestDateInput = document.querySelector('input[name="expected_harvest_date"]');
    const areaInput = document.querySelector('input[name="area_allocated_hectares"]');
    const seasonWarning = document.getElementById('season_warning');
    const areaInfo = document.getElementById('area_info');
    const areaWarning = document.getElementById('area_warning');
    
    function calculateHarvestDate() {
        if (cropTypeSelect.value && plantingDateInput.value) {
            const cropOption = cropTypeSelect.options[cropTypeSelect.selectedIndex];
            const cropText = cropOption.text;
            const daysMatch = cropText.match(/(\d+) days/);
            if (daysMatch) {
                const growingDays = parseInt(daysMatch[1]);
                const plantingDate = new Date(plantingDateInput.value);
                const harvestDate = new Date(plantingDate);
                harvestDate.setDate(plantingDate.getDate() + growingDays);
                harvestDateInput.value = harvestDate.toISOString().split('T')[0];
            }
        }
    }
    
    function checkSeasonalSuitability() {
        const cropId = cropTypeSelect.value;
        const season = seasonSelect.value;
        
        if (cropId && season) {
            // In a real implementation, this would check against crop.suitable_seasons
            // For now, we'll show a warning for off-season planting
            if (season === 'off') {
                seasonWarning.textContent = '⚠️ Off-season planting may require additional irrigation and care.';
                seasonWarning.classList.remove('hidden');
            } else {
                seasonWarning.classList.add('hidden');
            }
        }
    }
    
    function checkAreaAllocation() {
        const fieldId = fieldSelect.value;
        const area = parseFloat(areaInput.value);
        
        if (fieldId) {
            const fieldOption = fieldSelect.options[fieldSelect.selectedIndex];
            const fieldText = fieldOption.text;
            const areaMatch = fieldText.match(/\(([\d.]+) ha\)/);
            
            if (areaMatch) {
                const fieldArea = parseFloat(areaMatch[1]);
                areaInfo.textContent = `Field total area: ${fieldArea} ha`;
                
                if (area > fieldArea) {
                    areaWarning.textContent = `⚠️ Allocated area (${area} ha) exceeds field area (${fieldArea} ha)`;
                    areaWarning.classList.remove('hidden');
                } else {
                    areaWarning.classList.add('hidden');
                }
            }
        }
    }
    
    cropTypeSelect.addEventListener('change', calculateHarvestDate);
    plantingDateInput.addEventListener('change', calculateHarvestDate);
    seasonSelect.addEventListener('change', checkSeasonalSuitability);
    fieldSelect.addEventListener('change', checkAreaAllocation);
    areaInput.addEventListener('input', checkAreaAllocation);
</script>
{% endblock %}
